name: Compilar APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icono.jpg assets/origen.jpg
          echo '{"name":"visor-gps","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.0.0","@capacitor/cli":"^6.0.0","@capacitor/core":"^6.0.0","@capacitor/filesystem":"^6.0.0","@capacitor/share":"^6.0.0"},"devDependencies":{"@capacitor/assets":"^3.0.0"}}' > package.json
          echo '{"appId":"com.visor.gps","appName":"Visor GPS","webDir":"www"}' > capacitor.config.json
          pip install pillow
          python3 -c "
          from PIL import Image
          s = Image.open('assets/origen.jpg').convert('RGB')
          def f(n):
              c = Image.new('RGB', (1024, 1024), 'white')
              c.paste(s.resize((n, n), Image.LANCZOS), ((1024 - n) // 2, (1024 - n) // 2))
              return c
          f(900).save('assets/icon-only.png')
          f(640).save('assets/icon-foreground.png')
          Image.new('RGB', (1024, 1024), 'white').save('assets/icon-background.png')
          "
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
      - run: npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: visor-gps-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
