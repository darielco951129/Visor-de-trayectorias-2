<script>
const $=id=>document.getElementById(id);
// ---------- Decodificación del .log ----------
function hexBytes(h){const a=new Uint8Array(h.length>>1);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function Bits(b){this.b=b;this.p=0}
Bits.prototype.read=function(n){let v=0;for(let i=0;i<n;i++){v=v*2+((this.b[this.p>>3]>>(7-(this.p&7)))&1);this.p++}return v};
const s32=v=>v>=2147483648?v-4294967296:v;
function fechaMs(t,an){let ms=Date.UTC(1980+an,0,1)+t*1000;if(new Date().getFullYear()-new Date(ms).getUTCFullYear()>18)ms+=7168*864e5;return ms}
let ID='';
function parseLog(tx){ID=(tx.match(/\*{3}([^*#]+)\*{3}/)||[])[1]||'';const re=/#(\d+)#([0-9a-fA-F]+)/g,o=[];let m;
 while((m=re.exec(tx))){if(m[2].length<348)continue;const b=new Bits(hexBytes(m[2].slice(0,348)));
  const np=b.read(8),an=b.read(6);let t=b.read(25);b.read(7);let la=s32(b.read(32)),lo=s32(b.read(32)),sp=b.read(6);b.read(29);
  const add=()=>o.push({ms:fechaMs(t,an),lat:la/1e5,lon:lo/1e5,kmh:sp*3.6});add();
  for(let j=0;j<15;j++){const dt=b.read(12);b.read(7);const dl=b.read(18),dn=b.read(18);sp=b.read(6);b.read(22);
   t+=dt;la+=dl>131072?dl-262144:dl;lo+=dn>131072?dn-262144:dn;if(j<np-1)add()}}
 return o.sort((a,b)=>a.ms-b.ms)}
// ---------- Utilidades ----------
const pad=n=>String(n).padStart(2,'0');
function parts(ms){const z=$('tz').value;if(z==='auto'){const d=new Date(ms);return[d.getFullYear(),d.getMonth()+1,d.getDate(),d.getHours(),d.getMinutes()]}const d=new Date(ms+(+z)*36e5);return[d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes()]}
const dk=ms=>{const p=parts(ms);return p[0]+'-'+pad(p[1])+'-'+pad(p[2])},hm=ms=>{const p=parts(ms);return pad(p[3])+':'+pad(p[4])},ft=ms=>dk(ms)+' '+hm(ms);
const fd=ms=>{const m=Math.round(ms/6e4),h=Math.floor(m/60);return h?h+' h '+pad(m%60)+' min':m+' min'};
function km(a,b){const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lon-a.lon)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))}
// ---------- Proyección y mapa propio (sin librerías) ----------
const WS=z=>256*Math.pow(2,z);
function proj(la,lo,z){const s=WS(z),r=la*Math.PI/180;return[(lo+180)/360*s,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*s]}
function unproj(x,y,z){const s=WS(z);return[Math.atan(Math.sinh(Math.PI*(1-2*y/s)))*180/Math.PI,x/s*360-180]}
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,C={lat:22,lon:-80,z:7};
let ALL=[],P=[],SEG=[],EV=[],ST=[],MK=[],cache={};try{cache=JSON.parse(localStorage.ad||'{}')}catch(e){}
const TC={};function tile(z,x,y){const k=z+'/'+x+'/'+y;let t=TC[k];if(!t){t=TC[k]=new Image();t.onload=()=>{t.ok=1;if(t.u)URL.revokeObjectURL(t.u);draw()};
 const show=b=>{t.src=t.u=URL.createObjectURL(b)},U='https://tile.openstreetmap.org/'+k+'.png',
 web=()=>{if(t.w)return;t.w=1;if(!$('onl').checked||!navigator.onLine){t.bad=1;return}
  fetch(U).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{tput(k,b);show(b)}).catch(()=>{if(t.f){t.bad=1;return}t.f=1;t.src=U})};
 t.onerror=web;const e=MAPIDX&&MAPIDX[k];
 if(e)show(MAPF.slice(e[0],e[0]+e[1],MAPM));
 else tget(k).then(b=>b?show(b):(t.src=(window.TILEDATA&&TILEDATA[k])||'tiles/'+k+'.png'))}return t.ok?t:null}
function tiles(){const tz=Math.max(0,Math.min(19,Math.round(C.z))),sc=Math.pow(2,C.z-tz),c=proj(C.lat,C.lon,tz),n=1<<tz;
 for(let x=Math.floor((c[0]-W/2/sc)/256);x<=Math.floor((c[0]+W/2/sc)/256);x++)for(let y=Math.floor((c[1]-H/2/sc)/256);y<=Math.floor((c[1]+H/2/sc)/256);y++){
  if(y<0||y>=n)continue;const t=tile(tz,((x%n)+n)%n,y);if(t)ctx.drawImage(t,(x*256-c[0])*sc+W/2,(y*256-c[1])*sc+H/2,256*sc+.5,256*sc+.5)}}
function grid(c){const a=unproj(c[0]-W/2,c[1]-H/2,C.z),b=unproj(c[0]+W/2,c[1]+H/2,C.z),ppd=WS(C.z)/360;
 const st=[.001,.002,.005,.01,.02,.05,.1,.2,.5,1,2,5].find(s=>s*ppd>=90)||5;
 ctx.strokeStyle='#cbd5e1';ctx.fillStyle='#64748b';ctx.lineWidth=1;ctx.font='10px sans-serif';ctx.beginPath();
 for(let lo=Math.ceil(a[1]/st)*st;lo<=b[1];lo+=st){const x=proj(0,lo,C.z)[0]-c[0]+W/2;ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.fillText(lo.toFixed(3),x+2,H-3)}
 for(let la=Math.ceil(b[0]/st)*st;la<=a[0];la+=st){const y=proj(la,0,C.z)[1]-c[1]+H/2;ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.fillText(la.toFixed(3),2,y-2)}
 ctx.stroke()}
function draw(){if(!W)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#eef2f7';ctx.fillRect(0,0,W,H);
 const c=proj(C.lat,C.lon,C.z),S=(la,lo)=>{const p=proj(la,lo,C.z);return[p[0]-c[0]+W/2,p[1]-c[1]+H/2]};
 grid(c);tiles();
 const L=+$('lim').value||60,sp=P.map(p=>S(p.lat,p.lon)),pb=[0,1,2,3].map(()=>new Path2D),pg=new Path2D;MK=[];let ac=0;const ar=[];
 for(let i=1;i<P.length;i++){const a=sp[i-1],b=sp[i],gap=P[i].ms-P[i-1].ms>6e5,r=P[i].kmh/L,t=gap?pg:pb[r<.4?0:r<.7?1:r<1?2:3];t.moveTo(a[0],a[1]);t.lineTo(b[0],b[1]);
  const d=Math.hypot(b[0]-a[0],b[1]-a[1]);ac+=d;if(!gap&&ac>70&&d>4){ac=0;ar.push([(a[0]+b[0])/2,(a[1]+b[1])/2,Math.atan2(b[1]-a[1],b[0]-a[0])])}}
 ctx.lineJoin='round';ctx.setLineDash([4,6]);ctx.strokeStyle='#6b7280';ctx.lineWidth=1.5;ctx.stroke(pg);ctx.setLineDash([]);
 ['#16a34a','#84cc16','#eab308','#dc2626'].forEach((c,i)=>{ctx.lineWidth=i==3?5:3.5;ctx.strokeStyle=c;ctx.stroke(pb[i])});
 ctx.fillStyle='#111';ar.forEach(q=>{ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(q[2]);ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(-4,-4);ctx.lineTo(-4,4);ctx.fill();ctx.restore()});
 if($('nums').checked&&C.z>=12){ctx.font='bold 11px sans-serif';ctx.textAlign='center';const seen=new Set;
  P.forEach((p,i)=>{const x=sp[i][0],y=sp[i][1];if(p.kmh<1||x<0||y<0||x>W||y>H)return;const k=Math.floor(x/34)+','+Math.floor(y/16);if(seen.has(k))return;seen.add(k);
   const t=''+Math.round(p.kmh);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.strokeText(t,x,y-5);ctx.fillStyle=p.kmh>L?'#b91c1c':'#1e3a8a';ctx.fillText(t,x,y-5);
   ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fillStyle='#111';ctx.fill()});ctx.textAlign='left'}
 const mk=(la,lo,t,col,type,k)=>{const q=S(la,lo),x=q[0],y=q[1];MK.push({x,y,type,k});ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y+3.5);ctx.textAlign='left'};
 ST.forEach((s,k)=>{mk(s.lat,s.lon,'P'+(k+1),'#f59e0b','s',k);const q=S(s.lat,s.lon),t=fd(s.b-s.a);ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.strokeText(t,q[0],q[1]+25);ctx.fillStyle='#92400e';ctx.fillText(t,q[0],q[1]+25);ctx.textAlign='left'});
 [[P[0],'I','#16a34a'],[P[P.length-1],'F','#111827']].forEach(a=>{if(!a[0])return;const q=S(a[0].lat,a[0].lon);ctx.beginPath();ctx.arc(q[0],q[1],8,0,7);ctx.fillStyle=a[2];ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(a[1],q[0],q[1]+3);ctx.textAlign='left'});
 EV.forEach((e,k)=>mk(P[e.mi].lat,P[e.mi].lon,'E'+(k+1),'#dc2626','e',k));simMark(S);chart()}
function fit(a,mz=18){if(!a.length)return;const la=a.map(p=>p.lat),lo=a.map(p=>p.lon),n=Math.max(...la),s=Math.min(...la),w=Math.min(...lo),e=Math.max(...lo);
 let z=mz;for(;z>3;z--){const A=proj(n,w,z),B=proj(s,e,z);if(B[0]-A[0]<W-80&&B[1]-A[1]<H-80)break}
 C.z=z;C.lat=(n+s)/2;C.lon=(w+e)/2;draw()}
function zoomAt(sx,sy,nz){nz=Math.max(3,Math.min(19,nz));const c=proj(C.lat,C.lon,C.z),a=unproj(c[0]+sx-W/2,c[1]+sy-H/2,C.z);C.z=nz;const p=proj(a[0],a[1],nz),n=unproj(p[0]-(sx-W/2),p[1]-(sy-H/2),nz);C.lat=n[0];C.lon=n[1];draw()}
function panBy(dx,dy){const c=proj(C.lat,C.lon,C.z),n=unproj(c[0]-dx,c[1]-dy,C.z);C.lat=n[0];C.lon=n[1];draw()}
// ---------- Gestos ----------
const ptr=new Map;let pinch=0,moved=0;const two=()=>{const v=[...ptr.values()];return[Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2]};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;if(ptr.size==2)pinch=two()[0]};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),n=[e.offsetX,e.offsetY];ptr.set(e.pointerId,n);
 if(ptr.size==1){moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);panBy(n[0]-o[0],n[1]-o[1])}
 else if(ptr.size==2){const t=two();if(pinch)zoomAt(t[1],t[2],C.z+Math.log2(t[0]/pinch));pinch=t[0];moved=99}};
cv.onpointerup=cv.onpointercancel=e=>{if(ptr.size==1&&moved<6)click(e.offsetX,e.offsetY);ptr.delete(e.pointerId);pinch=0};
cv.onwheel=e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,C.z-Math.sign(e.deltaY)*.5)};
cv.ondblclick=e=>zoomAt(e.offsetX,e.offsetY,C.z+1);
function rs(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;draw()}addEventListener('resize',rs);
// ---------- Ventanas de detalle ----------
function pop(h){const p=$('pop');p.innerHTML='<b style="float:right;cursor:pointer;margin-left:10px" onclick="this.parentNode.style.display=\'none\'">✕</b>'+h;p.style.display='block'}
function showS(k){const s=ST[k];pop('<b>Parada P'+(k+1)+'</b><br>Llegada: '+ft(s.a)+'<br>Salida: '+ft(s.b)+'<br>Duración: <b>'+fd(s.b-s.a)+'</b><br>'+s.lat.toFixed(5)+', '+s.lon.toFixed(5)+'<br>Dirección: <span id="pa'+k+'">'+(s.addr||'(se obtiene con internet)')+'</span>');if(!s.addr&&navigator.onLine)addrs()}
function showE(k){const e=EV[k],p=P[e.mi];pop('<b>Exceso E'+(k+1)+'</b> (límite '+$('lim').value+' km/h)<br>Inicio: '+ft(e.a)+'<br>Fin: '+ft(e.b)+'<br>Duración: '+fd(e.b-e.a)+'<br>Distancia recorrida: <b>'+(e.d*1000).toFixed(0)+' m</b><br>Velocidad máx.: <b>'+Math.round(e.mx)+' km/h</b><br>'+p.lat.toFixed(5)+', '+p.lon.toFixed(5))}
function goS(k){const s=ST[k];C.lat=s.lat;C.lon=s.lon;C.z=16;draw();showS(k)}
function goE(k){const e=EV[k];fit(P.slice(e.i0-1,e.i1+1),17);showE(k)}
function click(x,y){let b=null,bd=16;MK.forEach(m=>{const d=Math.hypot(m.x-x,m.y-y);if(d<bd){bd=d;b=m}});
 if(b){b.type=='s'?showS(b.k):showE(b.k);return}
 const c=proj(C.lat,C.lon,C.z);let bi=-1;bd=16;P.forEach((p,i)=>{const q=proj(p.lat,p.lon,C.z),d=Math.hypot(q[0]-c[0]+W/2-x,q[1]-c[1]+H/2-y);if(d<bd){bd=d;bi=i}});
 if(bi>=0){const p=P[bi];pop('<b>'+ft(p.ms)+'</b><br>Velocidad: <b>'+Math.round(p.kmh)+' km/h</b><br>'+p.lat.toFixed(5)+', '+p.lon.toFixed(5))}}
// ---------- Cálculo: excesos y paradas ----------
function recalc(refit){const d=$('day').value;P=ALL.filter(p=>d==='all'||dk(p.ms)===d);
 SEG=P.map((p,i)=>i&&p.ms-P[i-1].ms<=6e5?km(P[i-1],p):0);
 const L=+$('lim').value||60,mn=(+$('ms').value||5)*6e4;EV=[];let c=null;
 for(let i=1;i<P.length;i++){const ov=P[i].ms-P[i-1].ms<=6e5&&P[i].kmh>L;
  if(ov){if(!c){c={a:P[i-1].ms,i0:i,d:0,mx:0,mi:i};EV.push(c)}c.d+=SEG[i];c.b=P[i].ms;c.i1=i;if(P[i].kmh>c.mx){c.mx=P[i].kmh;c.mi=i}}else c=null}
 ST=[];for(let i=0;i<P.length;){let j=i+1;while(j<P.length&&km(P[i],P[j])<.06)j++;
  const b=(j<P.length&&P[j].ms-P[j-1].ms<=12e4)?P[j].ms:P[j-1].ms;
  if(P[j-1].ms-P[i].ms>=mn)ST.push({ia:i,ib:j-1,lat:P[i].lat,lon:P[i].lon,a:P[i].ms,b,addr:cache[P[i].lat.toFixed(4)+','+P[i].lon.toFixed(4)]});i=j}
 $('st').textContent=(ID?ID+' · ':'')+P.length+' puntos';$('pop').style.display='none';legs();simReset();

 h+='<h3>Tramos entre paradas <button onclick="gz()">Exportar .gz</button></h3><table><tr><th>Tramo<th>Dur.<th>Dist.<th>Máx.<th>Mín.</tr>'+LG.map((l,k)=>'<tr class=c onclick="goL('+k+')"><td>'+l.de+'→'+l.a+'<td>'+fd(l.t1-l.t0)+'<td>'+l.d.toFixed(1)+' km<td>'+Math.round(l.mx)+'<td>'+Math.round(l.mn)+'</tr>').join('')+'</table><p class=ad>Mín. = velocidad mínima en movimiento (sin contar los 0 km/h de las paradas).</p>';

function SP(){const i=idxAt(SIM.t),p=P[i],q=P[i+1];if(!q||q.ms-p.ms>6e5||SIM.t<=p.ms)return{lat:p.lat,lon:p.lon,kmh:p.kmh,i};
 const f=(SIM.t-p.ms)/(q.ms-p.ms);return{lat:p.lat+(q.lat-p.lat)*f,lon:p.lon+(q.lon-p.lon)*f,kmh:p.kmh,i}}

 else{x+='<b>'+Math.round(s.kmh)+' km/h</b>';const l=LG.find(g=>SIM.t>=g.t0&&SIM.t<=g.t1);
  if(l){let mx=0,mn=1e9;for(let i=l.i0;i<=s.i;i++){const v=P[i].kmh;if(v>mx)mx=v;if(v>0&&v<mn)mn=v}
   x+='<br>Tramo '+l.de+'→'+l.a+' (en curso): máx <b>'+Math.round(mx)+'</b> · mín <b>'+Math.round(mn==1e9?0:mn)+'</b> km/h'}}
 const ul=LG.filter(g=>g.t1<=SIM.t).pop(),us=ST.map((a,i)=>[a,i]).filter(a=>a[0].b<=SIM.t).pop();

async function gz(){if(!P.length){alert('Primero carga un archivo .log');return}

  resumen:{puntos:P.length,distancia_km:r1(SEG.reduce((a,b)=>a+b,0)),vel_max_kmh:Math.round(Math.max(...P.map(p=>p.kmh))),paradas:ST.length,excesos:EV.length},
